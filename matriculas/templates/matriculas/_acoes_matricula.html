{% comment %}Concluir / registrar desistência de uma matrícula. Precisa de: matricula.{% endcomment %}
<div class="dropdown d-inline-block">
    <button class="btn btn-sm btn-outline-secondary dropdown-toggle" type="button" data-bs-toggle="dropdown" data-bs-auto-close="outside" aria-expanded="false">
        Encerrar
    </button>
    <div class="dropdown-menu dropdown-menu-end p-3" style="min-width: 16rem;">
        <form method="post" class="mb-0">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ request.get_full_path }}">
            <label class="form-label small mb-1" for="data_{{ matricula.pk }}">Data</label>
            <input type="date" name="data" id="data_{{ matricula.pk }}" class="form-control form-control-sm mb-2" value="{% now 'Y-m-d' %}">
            <div class="d-flex gap-2">
                <button type="submit" formaction="{% url 'matriculas:concluir' matricula.pk %}" class="btn btn-sm btn-success flex-fill">Concluiu</button>
                <button type="submit" formaction="{% url 'matriculas:desistir' matricula.pk %}" class="btn btn-sm btn-outline-danger flex-fill"
                        onclick="return confirm('Registrar desistência de {{ matricula.aluno.nome|escapejs }}? A vaga será liberada.');">Desistiu</button>
            </div>
        </form>
    </div>
</div>
